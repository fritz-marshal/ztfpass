[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ztfpass"
version = "0.1.0"
description = "Minimal passthrough from SkyPortal to the ZTF scheduler queue API (the one capability Kowalski used to provide)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "requests>=2.28",
    "sshtunnel>=0.4",
    "pyyaml>=6",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27", "ruff>=0.9", "pre-commit>=3"]

[project.scripts]
ztfpass = "ztfpass.__main__:main"

[tool.setuptools.packages.find]
include = ["ztfpass*"]

[tool.pytest.ini_options]
addopts = "-q"
